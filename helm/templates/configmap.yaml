apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apex-os-iam-pam.fullname" . }}-config
  labels:
    {{- include "apex-os-iam-pam.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  DOMAIN: {{ .Values.global.domain | quote }}
  LOG_LEVEL: {{ .Values.apiGateway.logLevel | quote }}
  API_GATEWAY_PORT: {{ .Values.apiGateway.port | quote }}
  AUTH_SERVICE_PORT: {{ .Values.authService.port | quote }}
  AUTHORIZATION_SERVICE_PORT: {{ .Values.authorizationService.port | quote }}
  SESSION_SERVICE_PORT: {{ .Values.sessionService.port | quote }}
  PAM_SERVICE_PORT: {{ .Values.pamService.port | quote }}
  VAULT_SERVICE_PORT: {{ .Values.vaultService.port | quote }}
  AUDIT_SERVICE_PORT: {{ .Values.auditService.port | quote }}
  USER_DIRECTORY_PORT: {{ .Values.userDirectory.port | quote }}
  POLICY_ENGINE_PORT: {{ .Values.policyEngine.port | quote }}
  WEB_UI_PORT: {{ .Values.webUI.port | quote }}
  JWT_ACCESS_TOKEN_TTL: {{ .Values.authService.jwt.accessTokenTTL | quote }}
  JWT_REFRESH_TOKEN_TTL: {{ .Values.authService.jwt.refreshTokenTTL | quote }}
  JWT_ISSUER: {{ .Values.authService.jwt.issuer | quote }}
  MFA_ENABLED: {{ .Values.authService.mfa.enabled | quote }}
  SESSION_TIMEOUT: {{ .Values.sessionService.sessionTimeout | quote }}
  MAX_CONCURRENT_SESSIONS: {{ .Values.sessionService.maxConcurrentSessions | quote }}
  IDLE_TIMEOUT: {{ .Values.sessionService.idleTimeout | quote }}
  PAM_SESSION_RECORDING: {{ .Values.pamService.sessionRecording | quote }}
  PAM_CREDENTIAL_INJECTION: {{ .Values.pamService.credentialInjection | quote }}
  PAM_JIT_ACCESS: {{ .Values.pamService.justInTimeAccess | quote }}
  PAM_APPROVAL_WORKFLOW: {{ .Values.pamService.approvalWorkflow | quote }}
  PAM_MAX_SESSION_DURATION: {{ .Values.pamService.maxSessionDuration | quote }}
  PAM_CHECKOUT_DURATION: {{ .Values.pamService.checkOutDuration | quote }}
  PAM_AUTO_ROTATE: {{ .Values.pamService.autoRotateCredentials | quote }}
  PAM_ROTATION_INTERVAL: {{ .Values.pamService.rotationInterval | quote }}
  AUDIT_LOG_FORMAT: {{ .Values.auditService.logFormat | quote }}
  AUDIT_RETENTION_DAYS: {{ .Values.auditService.retentionDays | quote }}
  AUDIT_IMMUTABLE_LOGS: {{ .Values.auditService.immutableLogs | quote }}
  LDAP_HOST: {{ .Values.authService.ldap.host | quote }}
  LDAP_PORT: {{ .Values.authService.ldap.port | quote }}
  LDAP_BASE_DN: {{ .Values.authService.ldap.baseDN | quote }}
  LDAP_BIND_DN: {{ .Values.authService.ldap.bindDN | quote }}
  POLICY_LANGUAGE: {{ .Values.policyEngine.policyLanguage | quote }}
  POLICY_STORE: {{ .Values.policyEngine.policyStore | quote }}
  POLICY_DEFAULT_DECISION: {{ .Values.policyEngine.defaultDecision | quote }}
  POLICY_EVALUATION_MODE: {{ .Values.policyEngine.evaluationMode | quote }}
  ZERO_TRUST: {{ .Values.features.zeroTrust | quote }}
  PASSWORDLESS: {{ .Values.features.passwordless | quote }}
  BIOMETRIC_AUTH: {{ .Values.features.biometricAuth | quote }}
  RISK_BASED_AUTH: {{ .Values.features.riskBasedAuth | quote }}
  SESSION_ANOMALY_DETECTION: {{ .Values.features.sessionAnomalyDetection | quote }}
  CREDENTIAL_THEFT_DETECTION: {{ .Values.features.credentialTheftDetection | quote }}
  RATE_LIMIT_ENABLED: {{ .Values.apiGateway.rateLimit.enabled | quote }}
  RATE_LIMIT_RPM: {{ .Values.apiGateway.rateLimit.requestsPerMinute | quote }}
  CORS_ENABLED: {{ .Values.apiGateway.cors.enabled | quote }}
  CORS_ALLOW_ORIGINS: {{ .Values.apiGateway.cors.allowOrigins | quote }}
  CORS_ALLOW_METHODS: {{ .Values.apiGateway.cors.allowMethods | quote }}
  CORS_ALLOW_HEADERS: {{ .Values.apiGateway.cors.allowHeaders | quote }}
