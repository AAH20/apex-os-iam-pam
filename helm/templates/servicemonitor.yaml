{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "apex-os-iam-pam.fullname" . }}-metrics
  labels:
    {{- include "apex-os-iam-pam.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: apex-os-iam-pam
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
      scheme: http
{{- end }}
