{{- if .Values.monitoring.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apex-os-iam-pam.fullname" . }}-prometheus-config
  labels:
    {{- include "apex-os-iam-pam.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: apex-os-iam-pam
        namespace: {{ .Release.Namespace }}
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: kubernetes_service_name
      - job_name: 'apex-os-iam-pam'
        static_configs:
          - targets:
              - {{ include "apex-os-iam-pam.fullname" . }}-api-gateway:{{ .Values.apiGateway.port }}
              - {{ include "apex-os-iam-pam.fullname" . }}-auth-service:{{ .Values.authService.port }}
              - {{ include "apex-os-iam-pam.fullname" . }}-authorization-service:{{ .Values.authorizationService.port }}
              - {{ include "apex-os-iam-pam.fullname" . }}-session-service:{{ .Values.sessionService.port }}
              - {{ include "apex-os-iam-pam.fullname" . }}-pam-service:{{ .Values.pamService.port }}
              - {{ include "apex-os-iam-pam.fullname" . }}-vault-service:{{ .Values.vaultService.port }}
              - {{ include "apex-os-iam-pam.fullname" . }}-audit-service:{{ .Values.auditService.port }}
              - {{ include "apex-os-iam-pam.fullname" . }}-user-directory:{{ .Values.userDirectory.port }}
              - {{ include "apex-os-iam-pam.fullname" . }}-policy-engine:{{ .Values.policyEngine.port }}
{{- end }}
