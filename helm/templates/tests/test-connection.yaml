apiVersion: v1
kind: Pod
metadata:
  name: {{ include "apex-os-iam-pam.fullname" . }}-test-connection
  labels:
    {{- include "apex-os-iam-pam.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "apex-os-iam-pam.fullname" . }}-api-gateway:{{ .Values.apiGateway.port }}/health']
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "apex-os-iam-pam.fullname" . }}-test-auth
  labels:
    {{- include "apex-os-iam-pam.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: curl
      image: curlimages/curl:latest
      command: ['curl']
      args: ['-f', 'http://{{ include "apex-os-iam-pam.fullname" . }}-auth-service:{{ .Values.authService.port }}/health']
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "apex-os-iam-pam.fullname" . }}-test-web-ui
  labels:
    {{- include "apex-os-iam-pam.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "apex-os-iam-pam.fullname" . }}-web-ui:{{ .Values.webUI.port }}/']
  restartPolicy: Never
