name: APEX-OS IAM/PAM CI/CD Pipeline

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      skip_rollback:
        description: 'Skip automatic rollback on failure'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: '1.22'
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  HELM_VERSION: '3.14.0'
  TRIVY_VERSION: '0.50.0'
  GRYPE_VERSION: '0.76.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # STAGE 1: BUILD
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute build variables
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build Go binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w -X main.version=${{ github.sha }} -X main.buildTime=${{ steps.vars.outputs.build_timestamp }}" -o bin/apexos-iam ./cmd/iam
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w -X main.version=${{ github.sha }} -X main.buildTime=${{ steps.vars.outputs.build_timestamp }}" -o bin/apexos-pam ./cmd/pam
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w -X main.version=${{ github.sha }} -X main.buildTime=${{ steps.vars.outputs.build_timestamp }}" -o bin/apexos-cli ./cmd/cli

      - name: Build frontend assets
        run: |
          cd web
          npm ci
          npm run build
          cd ..

      - name: Package Helm charts
        run: |
          helm package deploy/helm/apexos-iam -d bin/charts/
          helm package deploy/helm/apexos-pam -d bin/charts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            bin/
            web/dist/
          retention-days: 7

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.vars.outputs.short_sha }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ─────────────────────────────────────────────────────────────────────────
  # STAGE 2: TEST
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apexos
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: apexos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      vault:
        image: hashicorp/vault:1.15
        env:
          VAULT_DEV_ROOT_TOKEN_ID: test-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --health-cmd "vault status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: bin/

      - name: Run Go unit tests
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Run Go integration tests
        env:
          DATABASE_URL: postgres://apexos:testpassword@localhost:5432/apexos_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          VAULT_ADDR: http://localhost:8200
          VAULT_TOKEN: test-token
        run: |
          go test -v -tags=integration ./internal/... ./pkg/...

      - name: Run frontend tests
        run: |
          cd web
          npm ci
          npm run test:ci
          cd ..

      - name: Run Python SDK tests
        run: |
          cd sdk/python
          pip install -e ".[test]"
          pytest -v --cov=apexos --cov-report=xml
          cd ../..

      - name: Run API contract tests
        run: |
          docker run --rm \
            --network host \
            -v $(pwd)/tests/contract:/contracts:ro \
            pactfoundation/pact-cli:latest \
            verify --provider-base-url http://localhost:8080

      - name: Run load tests
        run: |
          docker run --rm \
            --network host \
            -v $(pwd)/tests/load:/tests:ro \
            grafana/k6:latest run /tests/smoke.js

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage.out
            coverage.html
            **/coverage.xml
            **/test-results.xml
          retention-days: 14

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/test-results.xml'
          reporter: java-junit

  # ─────────────────────────────────────────────────────────────────────────
  # STAGE 3: SECURITY SCAN
  # ─────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: bin/

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Run Trivy vulnerability scanner (container image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.short_sha }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Run Trivy misconfiguration scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          exit-code: '1'

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype version

      - name: Run Grype SBOM generation
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.short_sha }} -o spdx-json > sbom.spdx.json

      - name: Run Grype vulnerability scan
        run: |
          grype sbom.spdx.json --fail-on high --output sarif > grype-results.sarif

      - name: Run Gosec security linter
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'

      - name: Run npm audit
        run: |
          cd web
          npm audit --audit-level=high
          cd ..

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --requirement sdk/python/requirements.txt

      - name: Run Checkov IaC scanner
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            trivy-*.sarif
            grype-results.sarif
            gosec-results.sarif
            checkov-results.sarif
            sbom.spdx.json
          retention-days: 30

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Upload Grype results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: grype-results.sarif
          category: grype

  # ─────────────────────────────────────────────────────────────────────────
  # STAGE 4: DEPLOY
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    needs: [build, test, security-scan]
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: ${{ steps.deploy.outputs.deployment_url }}
    outputs:
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
      previous_revision: ${{ steps.deploy.outputs.previous_revision }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name apexos-${{ github.event.inputs.environment || 'staging' }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Get current deployment revision
        id: current
        run: |
          PREVIOUS_REVISION=$(kubectl get deployment apexos-iam -n apexos -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}' 2>/dev/null || echo "0")
          echo "previous_revision=$PREVIOUS_REVISION" >> "$GITHUB_OUTPUT"

      - name: Deploy with Helm
        id: deploy
        run: |
          DEPLOYMENT_ID=$(date +%s)
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

          helm upgrade --install apexos-iam ./bin/charts/apexos-iam-*.tgz \
            --namespace apexos \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build.outputs.short_sha }} \
            --set image.digest=${{ needs.build.outputs.image_digest }} \
            --set environment=${{ github.event.inputs.environment || 'staging' }} \
            --set deployment.id=$DEPLOYMENT_ID \
            --values deploy/helm/apexos-iam/values-${{ github.event.inputs.environment || 'staging' }}.yaml \
            --wait \
            --timeout 10m \
            --atomic

          helm upgrade --install apexos-pam ./bin/charts/apexos-pam-*.tgz \
            --namespace apexos \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build.outputs.short_sha }} \
            --set image.digest=${{ needs.build.outputs.image_digest }} \
            --set environment=${{ github.event.inputs.environment || 'staging' }} \
            --set deployment.id=$DEPLOYMENT_ID \
            --values deploy/helm/apexos-pam/values-${{ github.event.inputs.environment || 'staging' }}.yaml \
            --wait \
            --timeout 10m \
            --atomic

          echo "deployment_url=https://apexos-${{ github.event.inputs.environment || 'staging' }}.example.com" >> "$GITHUB_OUTPUT"

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/apexos-iam -n apexos --timeout=5m
          kubectl rollout status deployment/apexos-pam -n apexos --timeout=5m

      - name: Run database migrations
        run: |
          kubectl exec -n apexos deployment/apexos-iam -- ./apexos-iam migrate up

      - name: Notify deployment
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚀 APEX-OS IAM/PAM deployed to ${{ github.event.inputs.environment || 'staging' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*APEX-OS IAM/PAM* deployed to *${{ github.event.inputs.environment || 'staging' }}*\nCommit: ${{ github.sha }}\nDeployment ID: ${{ steps.deploy.outputs.deployment_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ─────────────────────────────────────────────────────────────────────────
  # STAGE 5: VALIDATION
  # ─────────────────────────────────────────────────────────────────────────
  validation:
    name: Post-Deploy Validation
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{.env.GO_VERSION }}

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Run health checks
        run: |
          BASE_URL="${{ needs.deploy.outputs.deployment_url }}"

          # IAM health check
          IAM_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/iam/health")
          if [ "$IAM_STATUS" != "200" ]; then
            echo "IAM health check failed with status $IAM_STATUS"
            exit 1
          fi

          # PAM health check
          PAM_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/pam/health")
          if [ "$PAM_STATUS" != "200" ]; then
            echo "PAM health check failed with status $PAM_STATUS"
            exit 1
          fi

          # Readiness check
          READY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/ready")
          if [ "$READY_STATUS" != "200" ]; then
            echo "Readiness check failed with status $READY_STATUS"
            exit 1
          fi

          echo "All health checks passed"

      - name: Run smoke tests
        run: |
          go test -v -tags=smoke -run TestSmoke ./tests/smoke/... \
            -base-url "${{ needs.deploy.outputs.deployment_url }}"

      - name: Run integration validation
        run: |
          go test -v -tags=e2e -run TestE2E ./tests/e2e/... \
            -base-url "${{ needs.deploy.outputs.deployment_url }}"

      - name: Validate IAM endpoints
        run: |
          BASE_URL="${{ needs.deploy.outputs.deployment_url }}"

          # Test authentication endpoint
          curl -sf "$BASE_URL/iam/v1/auth/token" -X POST \
            -H "Content-Type: application/json" \
            -d '{"grant_type":"client_credentials"}' > /dev/null || exit 1

          # Test user listing endpoint
          curl -sf "$BASE_URL/iam/v1/users" \
            -H "Authorization: Bearer ${{ secrets.TEST_API_TOKEN }}" > /dev/null || exit 1

          # Test role management endpoint
          curl -sf "$BASE_URL/iam/v1/roles" \
            -H "Authorization: Bearer ${{ secrets.TEST_API_TOKEN }}" > /dev/null || exit 1

          echo "IAM endpoint validation passed"

      - name: Validate PAM endpoints
        run: |
          BASE_URL="${{ needs.deploy.outputs.deployment_url }}"

          # Test session management
          curl -sf "$BASE_URL/pam/v1/sessions" \
            -H "Authorization: Bearer ${{ secrets.TEST_API_TOKEN }}" > /dev/null || exit 1

          # Test credential vault
          curl -sf "$BASE_URL/pam/v1/vault/secrets" \
            -H "Authorization: Bearer ${{ secrets.TEST_API_TOKEN }}" > /dev/null || exit 1

          # Test access policies
          curl -sf "$BASE_URL/pam/v1/policies" \
            -H "Authorization: Bearer ${{ secrets.TEST_API_TOKEN }}" > /dev/null || exit 1

          echo "PAM endpoint validation passed"

      - name: Run performance validation
        run: |
          docker run --rm \
            -v $(pwd:/tests/performance:/tests:ro \
            grafana/k6:latest run \
            --summary-trend-stats="avg,min,med,max,p(95),p(99)" \
            /tests/performance/validation.js \
            -e BASE_URL="${{ needs.deploy.outputs.deployment_url }}"

      - name: Check error rates
        run: |
          # Query Prometheus for error rate
          ERROR_RATE=$(curl -s "https://prometheus.example.com/api/v1/query?query=rate(http_requests_total{status=~'5..'}[5m])" \
            | jq -r '.data.result[0].value[1] // "0"')

          if (( $(echo "$ERROR_RATE > 0.01" | bc -l) )); then
            echo "Error rate too high: $ERROR_RATE"
            exit 1
          fi

          echo "Error rate acceptable: $ERROR_RATE"

      - name: Notify validation success
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ APEX-OS IAM/PAM validation passed for ${{ github.event.inputs.environment || 'staging' }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ─────────────────────────────────────────────────────────────────────────
  # STAGE 6: ROLLBACK
  # ─────────────────────────────────────────────────────────────────────────
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: [deploy, validation]
    if: always() && needs.validation.result == 'failure' && !github.event.inputs.skip_rollback
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name apexos-${{ github.event.inputs.environment || 'staging' }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Rollback IAM deployment
        run: |
          kubectl rollout undo deployment/apexos-iam -n apexos
          kubectl rollout status deployment/apexos-iam -n apexos --timeout=5m

      - name: Rollback PAM deployment
        run: |
          kubectl rollout undo deployment/apexos-pam -n apexos
          kubectl rollout status deployment/apexos-pam -n apexos --timeout=5m

      - name: Rollback database migrations
        run: |
          kubectl exec -n apexos deployment/apexos-iam -- ./apexos-iam migrate down

      - name: Verify rollback
        run: |
          BASE_URL="${{ needs.deploy.outputs.deployment_url }}"

          IAM_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/iam/health")
          PAM_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/pam/health")

          if [ "$IAM_STATUS" != "200" ] || [ "$PAM_STATUS" != "200" ]; then
            echo "Rollback verification failed"
            exit 1
          fi

          echo "Rollback verified successfully"

      - name: Notify rollback
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "⚠️ APEX-OS IAM/PAM rolled back in ${{ github.event.inputs.environment || 'staging' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*APEX-OS IAM/PAM* rolled back in *${{ github.event.inputs.environment || 'staging' }}*\nReason: Validation failed\nDeployment ID: ${{ needs.deploy.outputs.deployment_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Create incident issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Rollback: Validation failed for deployment ${context.payload.inputs?.deployment_id || 'unknown'}`,
              body: `Automatic rollback triggered due to validation failure.\n\nEnvironment: ${context.payload.inputs?.environment || 'staging'}\nCommit: ${context.sha}\nDeployment ID: ${context.payload.inputs?.deployment_id || 'unknown'}`,
              labels: ['incident', 'rollback', 'automated']
            })
