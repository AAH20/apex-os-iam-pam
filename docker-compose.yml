# APEX-OS IAM/PAM Local Development Stack
# Services: Keycloak, HashiCorp Vault, OPA, Pomerium, PostgreSQL, Redis, Prometheus, Grafana

version: "3.9"

x-common-volumes: &common-volumes
  - postgres-data
  - redis-data
  - vault-data
  - keycloak-data
  - opa-data
  - prometheus-data
  - grafana-data

networks:
  iam-pam:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  vault-data:
  keycloak-data:
  opa-data:
  prometheus-data:
  grafana-data:

services:

  # ──────────────────────────────────────────────
  # 1. PostgreSQL — Primary datastore for Keycloak
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: apex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iam-pam

  # ──────────────────────────────────────────────
  # 2. Redis — Session/cache store
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: apex-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_dev_password
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iam-pam

  # ──────────────────────────────────────────────
  # 3. Keycloak — Identity & Access Management
  # ──────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: apex-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev_password
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_dev_password
      KC_FEATURES: token-exchange,admin-fine-grained-authz
      KC_LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./realms:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - iam-pam

  # ──────────────────────────────────────────────
  # 4. HashiCorp Vault — Secrets management
  # ──────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.17
    container_name: apex-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/file
    command: server -dev -dev-root-token-id="dev-root-token"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iam-pam

  # ──────────────────────────────────────────────
  # 5. OPA — Open Policy Agent (authorization)
  # ──────────────────────────────────────────────
  opa:
    image: openpolicyagent/opa:0.68.0
    container_name: apex-opa
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--diagnostic-addr=0.0.0.0:8282"
      - "--set=decision_logs.console=true"
      - "--set=status.console=true"
      - "/policies"
    ports:
      - "8181:8181"
      - "8282:8282"
    volumes:
      - opa-data:/data
      - ./policies:/policies:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iam-pam

  # ──────────────────────────────────────────────
  # 6. Pomerium — Identity-aware reverse proxy
  # ──────────────────────────────────────────────
  pomerium:
    image: pomerium/pomerium:v0.27.0
    container_name: apex-pomerium
    restart: unless-stopped
    environment:
      # Identity provider
      IDP_PROVIDER: keycloak
      IDP_CLIENT_ID: pomerium
      IDP_CLIENT_SECRET: pomerium_client_secret
      IDP_URL: http://keycloak:8080/realms/apex
      IDP_SCOPES: openid,profile,email,offline_access
      # Cookie / encryption keys (dev-only — replace in prod)
      COOKIE_SECRET: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXphYmNkZWY=
      HASHICORP_VAULT_ADDR: http://vault:8200
      HASHICORP_VAULT_TOKEN: dev-root-token
      # Authorization
      POLICY_FILE: /pomerium/policy.yaml
      # Debug
      POMERIUM_DEBUG: "true"
      LOG_LEVEL: info
    ports:
      - "443:443"
      - "8443:8443"
    volumes:
      - ./pomerium/policy.yaml:/pomerium/policy.yaml:ro
      - ./pomerium/certs:/certs:ro
    depends_on:
      keycloak:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "https://localhost:443/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - iam-pam

  # ──────────────────────────────────────────────
  # 7. Prometheus — Metrics collection
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: apex-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iam-pam

  # ──────────────────────────────────────────────
  # 8. Grafana — Observability dashboards
  # ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: apex-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafana_dev_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_LOG_LEVEL: info
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iam-pam
